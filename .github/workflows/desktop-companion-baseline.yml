name: Desktop companion baseline inspection
on:
  push:
    branches: [codex/mf-165-mobile-voice]
    paths: [.github/workflows/desktop-companion-baseline.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public renderer and model provenance (no deployment)
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, hashlib, pathlib
          root='https://polite-semolina-b478fc.netlify.app/'
          out=pathlib.Path('baseline'); out.mkdir()
          def read(url):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MetaFlow-baseline-validation/1.0'}),timeout=30) as r:
              data=r.read(6_000_001)
              if len(data)>6_000_000: raise ValueError('Inspection size limit')
              print('FETCH',r.status,r.url,'BYTES',len(data),'SHA256',hashlib.sha256(data).hexdigest())
              return data.decode('utf-8')
          for path in ['renderer.js','display-calibration.mjs','orientation.mjs','tracking.mjs','about']:
            try:
              text=read(urllib.parse.urljoin(root,path));(out/path.replace('/','_')).write_text(text)
              print('=== PUBLIC ASSET '+path+' ===\n'+text+'\n=== END ASSET ===')
            except Exception as e: print('ERROR',path,str(e))
          for url in ['https://laplace.live/persona/vrm?locale=en','https://laplace.live/persona?locale=en']:
            try:
              text=read(url)
              print('=== OFFICIAL LINKS ===',re.findall(r'(?:href|src)=[\"\x27]([^\"\x27]+)',text))
              print('=== OFFICIAL TEXT ===',re.sub('<[^>]+>',' ',text)[:20000])
            except Exception as e: print('ERROR',url,str(e))
          PY
      - name: Preserve public source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-companion-public-source
          path: baseline/
          retention-days: 3
