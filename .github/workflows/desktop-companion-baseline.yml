name: Desktop companion baseline inspection
on:
  push:
    branches: [codex/mf-165-mobile-voice]
    paths: [.github/workflows/desktop-companion-baseline.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare actual flower-shop catalogue bytes (no asset modification)
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib,zipfile,io,struct
          def read(url,limit):
            with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'MetaFlow-catalogue-verification/1.0'}),timeout=45) as r:
              b=r.read(limit+1)
              if len(b)>limit:raise ValueError('Response too large')
              return b
          url='https://marketplace.laplace.live/api/items'
          try: catalogue=json.loads(read(url,2_000_000))
          except Exception as e: print('CATALOGUE_UNAVAILABLE',str(e));raise SystemExit(0)
          print('CATALOGUE',json.dumps(catalogue,ensure_ascii=False)[:80000])
          def walk(value):
            if isinstance(value,list):
              for x in value:yield from walk(x)
            elif isinstance(value,dict):
              if value.get('kind')=='vrm' and 'milky' in str(value.get('id','')).lower():yield value
              else:
                for v in value.values():yield from walk(v)
          for item in list(walk(catalogue))[:3]:
            d=item.get('download',{});link=d.get('url','')
            if not link.startswith('https://downloads.vrp.moe/persona-marketplace/'):continue
            b=read(link,50_000_000);h=hashlib.sha256(b).hexdigest()
            if h!=d.get('sha256'):raise ValueError('Catalogue archive hash mismatch')
            print('VERIFIED_ARCHIVE',item.get('id'),link,len(b),h)
            with zipfile.ZipFile(io.BytesIO(b)) as z:
              for f in z.infolist():
                if not f.filename.lower().endswith('.vrm') or f.file_size>50_000_000:continue
                raw=z.read(f)
                if raw[:4]!=b'glTF':continue
                n=struct.unpack_from('<I',raw,12)[0]
                gltf=json.loads(raw[20:20+n]);ext=gltf.get('extensions',{})
                meta=ext.get('VRMC_vrm',ext.get('VRM',{})).get('meta',{})
                print('VERIFIED_MODEL',f.filename,len(raw),hashlib.sha256(raw).hexdigest(),json.dumps(meta,ensure_ascii=False))
          PY
