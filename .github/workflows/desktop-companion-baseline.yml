name: Desktop companion baseline inspection
on:
  push:
    branches: [codex/mf-165-mobile-voice]
    paths: [.github/workflows/desktop-companion-baseline.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect existing public runtime (no authentication or deployment)
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, re, hashlib, pathlib
          root='https://polite-semolina-b478fc.netlify.app/'
          out=pathlib.Path('baseline'); out.mkdir()
          def read(url):
            req=urllib.request.Request(url,headers={'User-Agent':'MetaFlow-baseline-validation/1.0'})
            with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read(6_000_001)
              if len(data)>6_000_000: raise ValueError('Text inspection size limit')
              print('FETCH',r.status,r.url,'BYTES',len(data),'SHA256',hashlib.sha256(data).hexdigest())
              return data.decode('utf-8')
          html=read(root)
          (out/'index.html').write_text(html)
          print('=== PUBLIC ENTRY HTML ===\n'+html[:70000]+'\n=== END ENTRY ===')
          refs=re.findall(r'(?:src|href)=[\"\x27]([^\"\x27]+\.(?:m?js|css)(?:\?[^\"\x27]*)?)[\"\x27]',html)
          seen=set()
          for ref in refs[:12]:
            url=urllib.parse.urljoin(root,ref)
            if urllib.parse.urlparse(url).netloc!=urllib.parse.urlparse(root).netloc or url in seen: continue
            seen.add(url)
            text=read(url)
            (out/pathlib.Path(urllib.parse.urlparse(url).path).name).write_text(text)
            print('=== PUBLIC ASSET '+url+' ===')
            if len(text)<90000: print(text)
            else:
              print('LARGE ASSET: excerpted app-specific markers only')
              for m in list(re.finditer(r'(?i)wenjing|milky|明前|文镜|calibrat|\.vrm|sourceMappingURL',text))[:35]:
                print(text[max(0,m.start()-250):m.end()+600])
            print('=== END ASSET ===')
          PY
      - name: Preserve public baseline for comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-companion-public-baseline
          path: baseline/
          retention-days: 3
