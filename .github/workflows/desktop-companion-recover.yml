name: Recover verified desktop companion source
on:
  push:
    branches: [codex/mf-165-mobile-voice]
    paths: [.github/workflows/desktop-companion-recover.yml]
permissions:
  contents: write
jobs:
  recover:
    if: github.ref == 'refs/heads/codex/mf-165-mobile-voice'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Preserve public source with provenance (no deployment)
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, hashlib, json, os, base64
          repo=os.environ['REPO']; branch='codex/mf-165-mobile-voice'; expected=os.environ['EXPECTED_SHA']
          root='https://polite-semolina-b478fc.netlify.app/'
          prefix='metaflow-viewer/experiments/desktop-companion/'
          def api(path,data=None,method=None):
            req=urllib.request.Request('https://api.github.com/repos/'+repo+'/'+path,data=json.dumps(data).encode() if data is not None else None,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          def read(path):
            with urllib.request.urlopen(urllib.request.Request(root+path,headers={'User-Agent':'MetaFlow-source-recovery/1.0'}),timeout=30) as r:
              data=r.read(800001)
              if r.status!=200 or len(data)>800000:raise ValueError('Invalid public source response')
              return data.decode('utf-8')
          pins={'index.html':'4efe13cadc000f2dc9bfd76923f9a9ab68dc4727a41e0aee036458dd57f27d5f','app.js':'2b88b15cc555f5082c482e9d56e1ab65474a5dbe5a691ed9d933dfbc0b05b79d','renderer.js':'e9dcc9f9209acec87d94d8f3c38b3eda0ea7d44bbaa599afae91727ef8f52668','styles.css':'6a137475700abc2cbe0049d4fd31ffafea453591939017af77f78adf98b3fd3a'}
          paths={'index.html':'','styles.css':'styles.css','app.js':'app.js','renderer.js':'renderer.js','display-calibration.mjs':'display-calibration.mjs','orientation.mjs':'orientation.mjs','tracking.mjs':'tracking.mjs','geometry.mjs':'geometry.mjs','model-source.mjs':'model-source.mjs','about.html':'about','assets/milky-green.license.json':'assets/milky-green.license.json','assets/wenjing.license.json':'assets/wenjing.license.json','assets/THIRD_PARTY.md':'assets/THIRD_PARTY.md'}
          entries=[]; manifest={}
          for dest,path in paths.items():
            text=read(path); sha=hashlib.sha256(text.encode()).hexdigest()
            if dest in pins and sha!=pins[dest]:raise ValueError('Live source changed: '+dest)
            manifest[dest]={'url':root+path,'sha256':sha,'bytes':len(text.encode())}
            entries.append({'path':prefix+dest,'mode':'100644','type':'blob','content':text})
            print('SOURCE',dest,sha,len(text.encode()))
            if dest.endswith('.license.json') or dest.endswith('THIRD_PARTY.md') or dest=='model-source.mjs':print('PUBLIC PROVENANCE',dest,'\n',text)
          entries.append({'path':prefix+'baseline-manifest.json','mode':'100644','type':'blob','content':json.dumps({'origin':root,'capturedAt':'2026-11-14','files':manifest,'note':'Public source snapshot. Model and vendor binary assets are not copied into Git. No deployment performed.'},ensure_ascii=False,indent=2)+'\n'})
          planpath='docs/changes/165-desktop-portrait/plan.md'
          plan=api('contents/'+planpath+'?ref='+urllib.parse.quote(branch,safe=''))
          text=base64.b64decode(plan['content']).decode()
          text+='\n## 2026-11-14：独立 Netlify Three.js 站点增量\n\n用户追加：iPhone / iPad mini、小屏触控、横竖屏，角色动作和语音，以及花店 / Persona 的另一款 Milky Green，保留文镜与重建版。目标为现有 Netlify 独立站点，不能将早期 PlayCanvas 或另一 Three.js 样例冒充该部署。\n\n1. 以已核验 HTTP 200 的线上源码及 SHA-256 建立 `experiments/desktop-companion/` 可复现基线，二进制模型与依赖另行按清单恢复。\n2. 增加明确标注为近似起点的手机 / mini 设备配置；方向变化后重新核对画布和镜头，不根据 CSS 像素冒充毫米实测。\n3. 角色动作与观察者相机分离；加入短动作和恢复待机。系统朗读、可编辑文本和本地音频播放分别处理生命周期；口型幅度近似不标称音素对齐或原角色声音。\n4. 核对花店模型目录和真实文件元数据，独立于文镜和已保留的重建版；尚未获取的文件不得用替身或改名冒充。\n5. 运行纯模块测试与移动 / 平板 / 桌面浏览器渲染交互验证。当前 Browser 无源浏览器上下文，CI Playwright 作为受控验证，不宣称 iPhone / iPad 真机验收。\n6. 通过独立分支和 PR 留下源码与构建物；只有获得实际部署成功及线上回读证据才称已上线。Netlify 登录会话当前不在本会话可操作范围。\n'
          entries.append({'path':planpath,'mode':'100644','type':'blob','content':text})
          ref=api('git/ref/heads/'+branch)
          if ref['object']['sha']!=expected:raise ValueError('Branch advanced; do not overwrite')
          parent=api('git/commits/'+expected)
          tree=api('git/trees',{'base_tree':parent['tree']['sha'],'tree':entries})
          commit=api('git/commits',{'message':'build(MF-165): recover verified Netlify companion source and update mobile plan','tree':tree['sha'],'parents':[expected]})
          api('git/refs/heads/'+branch,{'sha':commit['sha'],'force':False},'PATCH')
          print('RECOVERED_COMMIT',commit['sha'])
          PY
