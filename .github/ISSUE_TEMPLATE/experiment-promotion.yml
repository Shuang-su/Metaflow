    attributes:
      label: Content to preserve, rewrite, or exclude
    validations:
      required: true
  - type: textarea
    id: quality
    attributes:
      label: Mobile, performance, accessibility, and degradation requirements
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Research and product implementation boundary
    validations:
      required: true
