name: Experiment promotion proposal
description: 提议把 Design 研究转为公共产品能力。
title: "[Experiment Promotion] "
labels: ["component/design", "type/experiment-promotion", "risk/T2"]
body:
  - type: dropdown
    id: current_status
    attributes:
      label: 当前状态
      options: [Proposed, Ready, In Progress, In Review, Done, Parked, Rejected, Rolled Back]
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 研究来源、license、capture date、redistributability、目标用户和证据。
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 目标信息架构、用户价值和成功信号。
    validations:
      required: true
  - type: textarea
    id: content_boundary
    attributes:
      label: 研究与产品边界
      description: 明确保留、重写、排除的内容及 mobile、performance、accessibility、degradation 要求。
    validations:
      required: true
  - type: textarea
    id: included_scope
    attributes:
      label: 包含范围
    validations:
      required: true
  - type: textarea
    id: excluded_scope
    attributes:
      label: 排除范围
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 风险、依赖与回退
      description: 包含来源、许可、性能、无障碍和产品边界风险。
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Spec / Plan 与相关任务
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: 完成交付
      description: 完成后回填 PR、squash commit、验证和遗留事项。
    validations:
      required: true
