name: Change
description: 提交一个具备完整背景、范围、验收和状态的变更。
title: "[Change] "
labels: ["component/platform", "type/maintenance", "risk/T1"]
body:
  - type: dropdown
    id: current_status
    attributes:
      label: 当前状态
      options: [Open, In Progress, In Review, Done, Released, Observing, Blocked, Parked, Rejected, Rolled Back]
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 说明现状、问题、证据以及为什么现在处理。
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 描述期望结果，不写文件级实现步骤。
    validations:
      required: true
  - type: textarea
    id: included_scope
    attributes:
      label: 包含范围
    validations:
      required: true
  - type: textarea
    id: excluded_scope
    attributes:
      label: 排除范围
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可核验的 Markdown checklist。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 风险、依赖与回退
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Spec / Plan 与相关任务
      description: 链接具体 API、文件步骤、测试命令和 Codex 任务；不适用时说明原因。
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: 完成交付
      description: 未完成时写明尚未完成；完成后回填 PR、squash commit、验证和遗留事项。
    validations:
      required: true
