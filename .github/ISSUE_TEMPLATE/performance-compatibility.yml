name: Performance or compatibility
description: 报告可量化的性能、浏览器、设备、渲染或数据兼容问题。
title: "[Compatibility] "
labels: ["type/performance", "risk/T1"]
body:
  - type: dropdown
    id: current_status
    attributes:
      label: 当前状态
      options: [Open, In Progress, In Review, Done, Blocked, Parked, Rejected, Rolled Back]
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 影响、基线和为什么现在处理。
    validations:
      required: true
  - type: textarea
    id: matrix
    attributes:
      label: 环境、观察结果与证据
      description: Browser、版本、设备、OS、WebGL/WebGPU、route、data、测量和复现。
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 期望结果、预算或兼容基线。
    validations:
      required: true
  - type: textarea
    id: included_scope
    attributes:
      label: 包含范围
    validations:
      required: true
  - type: textarea
    id: excluded_scope
    attributes:
      label: 排除范围
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 写明环境矩阵和数值阈值。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 风险、依赖与回退
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Spec / Plan 与相关任务
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: 完成交付
      description: 完成后回填 PR、squash commit、验证和遗留事项。
    validations:
      required: true
