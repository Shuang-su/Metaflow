name: Product or feature proposal
description: 提议产品、交互、UI 或数据能力。
title: "[Proposal] "
labels: ["type/proposal", "risk/T2"]
body:
  - type: dropdown
    id: current_status
    attributes:
      label: 当前状态
      options: [Proposed, Ready, In Progress, In Review, Done, Parked, Rejected, Rolled Back]
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 问题、机会、用户场景、证据以及为什么现在做。
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 说明用户结果和可衡量成功信号。
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: 方案与取舍
      description: 方案、成本、依赖和推荐。
    validations:
      required: true
  - type: textarea
    id: included_scope
    attributes:
      label: 包含范围
    validations:
      required: true
  - type: textarea
    id: excluded_scope
    attributes:
      label: 排除范围
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 使用可核验 checklist。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 风险、依赖与回退
      description: 包含兼容、安全、隐私、性能和迁移风险。
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Spec / Plan 与相关任务
      description: 链接决策后的唯一 Spec/Plan、ADR 和 Codex 任务。
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: 完成交付
      description: 完成后回填 PR、squash commit、验证和遗留事项。
    validations:
      required: true
