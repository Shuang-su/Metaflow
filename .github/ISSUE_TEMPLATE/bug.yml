name: Bug report
description: 报告一个可复现缺陷，并给出完整任务边界。
title: "[Bug] "
labels: ["type/bug", "risk/T1"]
body:
  - type: dropdown
    id: current_status
    attributes:
      label: 当前状态
      options: [Open, In Progress, In Review, Done, Blocked, Parked, Rejected, Rolled Back]
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
      description: 观察到什么、影响谁、为什么现在修复。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现与证据
      description: 包含 route、输入、环境、确定性步骤、日志或失败测试；移除秘密。
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 写明修复后的可观察行为。
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [viewer, editor, design, data, platform, reference]
    validations:
      required: true
  - type: textarea
    id: included_scope
    attributes:
      label: 包含范围
    validations:
      required: true
  - type: textarea
    id: excluded_scope
    attributes:
      label: 排除范围
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 包含回归证据与兼容边界。
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 风险、依赖与回退
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: Spec / Plan 与相关任务
      description: 链接适用的技术细节；简单修复不需要独立 Spec/Plan 时说明原因。
    validations:
      required: true
  - type: textarea
    id: delivery
    attributes:
      label: 完成交付
      description: 完成后回填 PR、squash commit、验证和遗留事项。
    validations:
      required: true
