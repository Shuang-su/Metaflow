name: Bug report
description: Report a reproducible defect.
title: "[Bug] "
labels: ["type/bug", "risk/T1"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What did you observe?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include route, input, environment, and deterministic steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [viewer, editor, design, data, platform, reference]
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, recordings, or a failing test. Remove secrets.
  - type: textarea
    id: non_goals
    attributes:
      label: Non-goals
