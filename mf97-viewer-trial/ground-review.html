<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>地面修正审查</title>
<style>
body{margin:0;background:#f3f5f7;color:#202a34;font:15px system-ui,sans-serif}main{max-width:1150px;margin:auto;padding:24px}h1{font-size:24px}p{line-height:1.6}button,input,select{font:inherit}button{padding:9px 14px;border:1px solid #c5cdd5;border-radius:6px;background:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}.visuals{display:grid;grid-template-columns:1fr 1fr;gap:16px}canvas{width:100%;background:white;border:1px solid #c5cdd5;border-radius:6px}.notice{background:#e7eef5;padding:12px 16px;border-radius:6px}.metrics{white-space:pre-line;background:white;padding:16px;border-radius:6px}#error{color:#a32727}#accept{background:#deefdf}#reject{background:#f7e2d7}label{display:block}small{color:#66737f}@media(max-width:700px){.visuals{grid-template-columns:1fr}main{padding:16px}}
</style></head><body><main><h1>地面修正审查</h1><p class="notice">原始碰撞保持只读。选择接受、拒绝或撤销后可导出审查决定；导出不会修改体素。接受项还须通过物理移动与导航验证。</p>
<label>载入一个或多个 <code>chunk-*.review.json</code> 分块报告：<input id="files" type="file" accept=".json" multiple></label>
<p><label>核验原始碰撞（选择对应的 <code>walk.voxel.json</code> 与 <code>walk.voxel.bin</code>）：<input id="source-files" type="file" accept=".json,.bin" multiple></label><span id="verification">源指纹尚未核验。</span></p>
<label>审查决定依据（接受前须查看当前修改的高斯剖面）：<input id="decision-reason" type="text" placeholder="说明属于噪声或真实结构的具体证据" style="width:min(680px,90%)"></label><div class="bar"><button id="previous">上一个</button><select id="candidate" aria-label="候选修正"></select><button id="next">下一个</button><button id="accept">接受本项</button><button id="reject">拒绝本项</button><button id="revert">撤销本项决定</button><button id="export">导出审查决定</button></div>
<section aria-label="高斯剖面对照"><h2>逐项高斯剖面对照</h2><p>独立渲染原高斯；黄点为原碰撞支持，绿线为候选平面，橙框移除、蓝框填补。剖面以所选修改为中心，不修改主 Viewer。</p><div class="bar"><select id="section-edit" aria-label="查看的体素修改"></select><select id="section-axis" aria-label="剖面方向"><option value="z">X–Y 侧剖面</option><option value="x">Z–Y 侧剖面</option></select><button id="section-render" disabled>生成高斯剖面对照</button><button id="section-cancel">取消生成</button><label><input id="section-overlay" type="checkbox" checked>叠加碰撞与修改</label></div><p id="section-status" role="status">尚未载入候选。</p><canvas id="gaussian-section" width="1000" height="600"></canvas><canvas id="section-renderer" width="1000" height="600" style="position:absolute;left:-1100px;pointer-events:none" aria-hidden="true"></canvas></section><p id="error" role="alert"></p><p id="policy" role="status"></p><p id="summary">尚未载入报告。</p><div class="visuals"><div><p>俯视：灰点为原支持面；绿色为候选面；橙色移除体素，蓝色增加体素。</p><canvas id="top" width="1000" height="620"></canvas></div><div><p>侧视 X–Y：原支持面与候选面高度。重叠楼层分别显示。</p><canvas id="side" width="1000" height="620"></canvas></div></div><p id="detail" class="metrics"></p><small>未检测到平面或边界证据不足的位置保留未知状态；天花、屋顶和展台上的平面不会自动确认为可行走楼层。</small></main><script type="module" src="/src/ground/review-ui.ts"></script></body></html>
