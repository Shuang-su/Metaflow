<!DOCTYPE html>
<html>
    <head>
        <title>Metaflow Editor</title>
        <meta charset="utf-8" />
        <base href="__BASE_HREF__">
        <link rel="manifest" href="./manifest.json">
        <link rel="stylesheet" href="./index.css">
        <link rel="icon" href="./static/icons/logo-192.png" type="image/png">
        <meta name="description" content="Metaflow Editor is an advanced browser-based editor for manipulating and optimizing 3D Gaussian Splats. It is open source and engine agnostic." />
        <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />

        <!-- Retire only this Editor's old cache; do not reload unsaved tabs. -->
        <script>
            const editorScope = new URL('./', document.baseURI).href;
            navigator.serviceWorker?.getRegistrations().then(registrations => {
                registrations.filter(registration => registration.scope === editorScope)
                    .forEach(registration => registration.unregister());
            }).catch(console.warn);
            window.caches?.keys().then(names => Promise.all(names
                .filter(name => name.startsWith('metaflow-editor-v'))
                .map(name => caches.delete(name)))).catch(console.warn);
        </script>

        <!-- Never let dropped files fall through to the browser, which opens
             each one in a tab. Active before the editor starts; once it has,
             its own drop handler imports them. -->
        <script>
            ['dragover', 'drop'].forEach((type) => window.addEventListener(type, (e) => {
                if (e.dataTransfer?.types.includes('Files')) e.preventDefault();
            }));
        </script>
    </head>

    <body>
        <script type="module" src="./index.js"></script>
    </body>
</html>
