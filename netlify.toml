[build]
  base = "metaflow-viewer"
  command = "node ../scripts/mcl.mjs check-all && python3 ../scripts/validate_platform.py && npm --prefix ../metaflow-editor ci && npm --prefix ../metaflow-editor test && npm --prefix ../metaflow-editor run lint && npm --prefix ../metaflow-editor run build && python3 ../scripts/generate_editor_version.py && npm --prefix ../metaflow-editor run test:runtime && npm ci && python3 ../scripts/generate_index.py && npm run build && mkdir -p public/data public/editor && rsync -a --delete ../data/ public/data/ && rsync -a --delete ../metaflow-editor/dist/ public/editor/"
  publish = "public"

# Custom domain redirects - 深圳技术大学.com → /sztu/c2-lib
[[redirects]]
  from = "/"
  to = "/sztu/c2-lib"
  status = 302
  force = true
  conditions = {Host = ["xn--fes68bkzcz5lkjgrkl.com", "www.xn--fes68bkzcz5lkjgrkl.com"]}

# Handle SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/data/*"
  to = "/data/:splat"
  status = 200

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200

# Editor routes - serve editor files directly, SPA fallback for editor
[[redirects]]
  from = "/editor/*"
  to = "/editor/:splat"
  status = 200

# Analytics dashboard - keep Metabase on a login-protected subdomain.
[[redirects]]
  from = "/dashboard"
  to = "https://dashboard.metaflow.shuang-su.com/metaflow/"
  status = 302
  force = true

[[redirects]]
  from = "/dashboard/*"
  to = "https://dashboard.metaflow.shuang-su.com/dashboard/:splat"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better caching, CORS, and WebXR
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Permissions-Policy = "xr-spatial-tracking=*"
    Accept-CH = "Sec-CH-UA, Sec-CH-UA-Mobile, Sec-CH-UA-Platform, Sec-CH-UA-Model, Sec-CH-UA-Platform-Version, Sec-CH-UA-Arch, Sec-CH-UA-Bitness"

[[headers]]
  for = "/editor/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/index.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.sog"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"

[[headers]]
  for = "*.ply"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/octet-stream"
