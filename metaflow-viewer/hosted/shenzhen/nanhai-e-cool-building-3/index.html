<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>南海意库3栋 · Nanhai E-Cool</title>
    <link rel="icon" href="/assets/metaflow_logo.svg">
    <link rel="stylesheet" href="/index.css">
    <link rel="stylesheet" href="/shenzhen/map-window.css">
    <link rel="stylesheet" href="/shenzhen/nanhai-e-cool-building-3/map.css">
</head>
<body>
    <main id="viewer" aria-label="南海意库3栋"></main>
    <template id="map-control"><button class="sse-mapButton sse-controlButton" id="map-launcher" aria-controls="site-map" title="小地图" aria-label="小地图" aria-pressed="false">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
                        <path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2Zm6-2v16m6-14v16"/>
                    </svg>
                </button></template>
    <aside class="sse-guidance" id="site-map" role="region" aria-label="小地图" hidden>
        <div class="sse-guidanceSurface">
            <p class="sse-mapMoveText"><span>南海意库3栋</span><span id="current-floor">定位中</span></p>
            <div class="sse-guidanceMap">
                <div class="sse-guidanceMapViewport">
                    <canvas id="map-canvas" width="440" height="440" role="img" aria-label="当前楼层、位置和朝向"></canvas>
                </div>
                <div class="sse-guidanceMapActions">
                    <button type="button" class="sse-guidanceMapView" data-mode="follow" aria-pressed="false">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 8 18-8-5-8 5Z"/></svg><span>跟随</span>
                    </button>
                    <button type="button" class="sse-guidanceMapView" data-mode="overview" aria-pressed="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>全览</span>
                    </button>
                </div>
            </div>
        </div>
    </aside>
    <button id="repairs" hidden aria-pressed="false">显示补面</button>
    <p role="status" id="load-status">正在载入南海意库3栋…</p>
    <script type="module" src="/shenzhen/nanhai.js"></script>
</body>
</html>
