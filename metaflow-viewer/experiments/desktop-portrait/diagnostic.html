<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VRM Diagnostics - Desktop Portrait</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 20px;
    }
    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 60%;
      height: 100vh;
      border: none;
    }
    #diagnostics {
      position: fixed;
      right: 0;
      top: 0;
      width: 40%;
      height: 100vh;
      overflow-y: auto;
      padding: 20px;
      background: #242424;
      font-size: 12px;
      font-family: 'SF Mono', 'Monaco', 'Courier New', monospace;
    }
    h2 { 
      color: #a0d9ff;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .section {
      background: #1a1a1a;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      padding: 4px 0;
    }
    .label {
      color: #888;
      flex: 0 0 140px;
    }
    .value {
      color: #ffd700;
      font-weight: 500;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .value.changed {
      color: #00ff00;
      font-weight: 700;
    }
    .status {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
    }
    .status.ready { background: #00ff0033; color: #00ff00; }
    .status.loading { background: #ffa50033; color: #ffa500; }
    button {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      margin: 4px;
    }
    button:hover { background: #357abd; }
    #controls {
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <iframe id="app" src="./index.html?vrm=Seed-san.vrm"></iframe>
  <div id="diagnostics">
    <h2>VRM Desktop Portrait Diagnostics</h2>
    
    <div class="section">
      <h2>Status</h2>
      <div id="status-display"></div>
    </div>
    
    <div class="section">
      <h2>VRM Expressions (Live)</h2>
      <div id="expressions-display"></div>
    </div>
    
    <div class="section">
      <h2>Animation Controller</h2>
      <div id="controller-display"></div>
    </div>
    
    <div class="section">
      <h2>Camera/Projection</h2>
      <div id="camera-display"></div>
    </div>
    
    <div id="controls">
      <button id="pause-btn">Pause Updates</button>
      <button id="clear-btn">Clear Highlights</button>
    </div>
  </div>

  <script type="module">
    const iframe = document.getElementById('app');
    let isPaused = false;
    let previousValues = {};

    function formatValue(val) {
      if (typeof val === 'number') {
        return val.toFixed(3);
      }
      if (typeof val === 'object' && val !== null) {
        return JSON.stringify(val, null, 2);
      }
      return String(val);
    }

    function hasChanged(key, newVal) {
      if (previousValues[key] !== newVal) {
        previousValues[key] = newVal;
        return true;
      }
      return false;
    }

    function renderRow(label, value, key) {
      const changed = hasChanged(key, value);
      return `
        <div class="row">
          <span class="label">${label}</span>
          <span class="value ${changed ? 'changed' : ''}">${formatValue(value)}</span>
        </div>
      `;
    }

    function update() {
      if (isPaused) return;

      try {
        const appWindow = iframe.contentWindow;
        if (!appWindow || !appWindow.diagnostics) {
          document.getElementById('status-display').innerHTML = '<div class="status loading">Loading...</div>';
          return;
        }

        const diag = appWindow.diagnostics();

        // Status
        const statusHtml = `
          <div class="status ${diag.ready ? 'ready' : 'loading'}">
            ${diag.ready ? 'Ready' : 'Initializing'}
          </div>
          ${renderRow('Model Type', diag.modelType, 'modelType')}
          ${renderRow('Asset', diag.assetName, 'assetName')}
          ${renderRow('Gaussian Count', diag.gaussianCount, 'gaussianCount')}
        `;
        document.getElementById('status-display').innerHTML = statusHtml;

        // Expressions
        if (diag.vrmExpressionValues) {
          const expHtml = Object.entries(diag.vrmExpressionValues)
            .map(([name, weight]) => renderRow(name, weight, `expr_${name}`))
            .join('');
          document.getElementById('expressions-display').innerHTML = expHtml || '<em>No expressions</em>';
        }

        // Animation Controller
        if (diag.vrmAnimController) {
          const ctrl = diag.vrmAnimController;
          const ctrlHtml = `
            ${renderRow('Breath Phase', ctrl.breathPhase, 'breathPhase')}
            ${renderRow('Blink Phase', ctrl.blinkPhase, 'blinkPhase')}
            ${renderRow('Mouth Open', ctrl.mouthOpen, 'mouthOpen')}
          `;
          document.getElementById('controller-display').innerHTML = ctrlHtml;
        }

        // Camera
        if (diag.eye) {
          const camHtml = `
            ${renderRow('Eye X', diag.eye.x, 'eyeX')}
            ${renderRow('Eye Y', diag.eye.y, 'eyeY')}
            ${renderRow('Eye Z', diag.eye.z, 'eyeZ')}
            ${renderRow('Tilt', diag.tilt, 'tilt')}
          `;
          document.getElementById('camera-display').innerHTML = camHtml;
        }

      } catch (err) {
        console.error('Diagnostic update error:', err);
      }
    }

    // Update 10 times per second
    setInterval(update, 100);

    document.getElementById('pause-btn').addEventListener('click', () => {
      isPaused = !isPaused;
      document.getElementById('pause-btn').textContent = isPaused ? 'Resume Updates' : 'Pause Updates';
    });

    document.getElementById('clear-btn').addEventListener('click', () => {
      previousValues = {};
    });
  </script>
</body>
</html>
