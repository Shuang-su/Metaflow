<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=3bfd13eb-93ba-49fa-833c-123eefe713f4
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRM Desktop Portrait</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            min-width: 0;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #controls {
            width: 300px;
            background: rgba(0, 0, 0, 0.95);
            padding: 20px;
            overflow-y: auto;
            font-size: 13px;
            border-left: 1px solid #374151;
            flex-shrink: 0;
        }
        
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            #canvas-container {
                flex: 1;
                min-height: 0;
            }
            #controls {
                width: 100%;
                max-height: 40vh;
                border-left: none;
                border-top: 1px solid #374151;
            }
        }
        h3 {
            margin: 0 0 12px 0;
            font-size: 14px;
            color: #60a5fa;
            border-bottom: 1px solid #374151;
            padding-bottom: 8px;
        }
        .control-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 4px;
            color: #9ca3af;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="range"] {
            width: 100%;
            margin: 4px 0;
        }
        .value-display {
            text-align: right;
            color: #60a5fa;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 6px 0;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }
        button:hover {
            background: #2563eb;
        }
        button:active {
            background: #1d4ed8;
        }
        #status {
            padding: 8px 12px;
            background: rgba(59, 130, 246, 0.15);
            border-left: 3px solid #3b82f6;
            border-radius: 4px;
            margin-bottom: 16px;
            font-size: 11px;
            line-height: 1.4;
        }
        #status.error {
            background: rgba(239, 68, 68, 0.15);
            border-left-color: #ef4444;
        }
        #status.success {
            background: rgba(34, 197, 94, 0.15);
            border-left-color: #22c55e;
        }
        input[type="file"] {
            width: 100%;
            padding: 8px;
            background: #374151;
            border: 1px solid #4b5563;
            border-radius: 4px;
            color: #e0e0e0;
            font-size: 11px;
            cursor: pointer;
        }
        input[type="file"]::file-selector-button {
            background: #4b5563;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 8px;
        }
        input[type="file"]::file-selector-button:hover {
            background: #6b7280;
        }
        button.secondary {
            background: #4b5563;
        }
        button.secondary:hover {
            background: #6b7280;
        }
        button.secondary:active {
            background: #374151;
        }
        .model-credit {
            margin-top: 10px;
            color: #9ca3af;
            font-size: 11px;
            line-height: 1.55;
            text-transform: none;
            letter-spacing: 0;
            text-align: left;
        }
        .model-credit a {
            color: #93c5fd;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="main-canvas"></canvas>
    </div>
    
    <div id="controls">
        <div id="status">正在初始化...</div>
        
        <div class="control-group">
            <h3>屏幕参数</h3>
            <label>屏幕宽度 (m)</label>
            <input type="range" id="screenWidth" min="0.08" max="0.8" step="0.01" value="0.34">
            <div class="value-display" id="screenWidthValue">0.34 m</div>
            
            <label>屏幕高度 (m)</label>
            <input type="range" id="screenHeight" min="0.04" max="1.0" step="0.01" value="0.21">
            <div class="value-display" id="screenHeightValue">0.21 m</div>
            
            <label>支架倾角 (度)</label>
            <input type="range" id="tiltDegrees" min="0" max="90" step="1" value="15">
            <div class="value-display" id="tiltDegreesValue">15°</div>
        </div>
        
        <div class="control-group">
            <h3>眼睛位置 (m)</h3>
            <label>水平 X (左←→右)</label>
            <input type="range" id="eyeX" min="-0.3" max="0.3" step="0.01" value="-0.03">
            <div class="value-display" id="eyeXValue">-0.03 m</div>
            
            <label>垂直 Y (下←→上)</label>
            <input type="range" id="eyeY" min="-0.4" max="0.4" step="0.01" value="0">
            <div class="value-display" id="eyeYValue">0.00 m</div>
            
            <label>深度 Z (屏幕←→眼睛)</label>
            <input type="range" id="eyeZ" min="0.2" max="1.5" step="0.01" value="0.48">
            <div class="value-display" id="eyeZValue">0.48 m</div>
        </div>
        
        <div class="control-group">
            <h3>模型</h3>
            <input type="file" id="vrmFile" accept=".vrm">
            <button id="loadDefaultModel">重新加载文镜</button>
            <button id="loadSampleModel" class="secondary">加载 pixiv 示例模型</button>
            <p class="model-credit">默认模型：文镜（Wenjing）。作者：LAPLACE Live! × 彩茫。许可：<a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-NC-SA 4.0</a>。仅供非商业测试，请保留署名；改编需以相同许可分享。参考：<a href="https://laplace.live/persona" target="_blank" rel="noopener noreferrer">LAPLACE Persona</a>。<br>可选示例模型 VRM1_Constraint_Twist_Sample 由 pixiv Inc. 提供，许可见 <a href="https://vrm.dev/licenses/1.0/" target="_blank" rel="noopener noreferrer">VRM License 1.0</a>。</p>
        </div>
        
        <div class="control-group">
            <h3>测试</h3>
            <button id="playTestAudio">播放测试音频 (3秒)</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three.module.js",
            "three/addons/": "./vendor/addons/",
            "@pixiv/three-vrm": "./vendor/three-vrm.module.js"
        }
    }
    </script>
    <script type="module" src="./app.mjs"></script>
</body>
</html>
