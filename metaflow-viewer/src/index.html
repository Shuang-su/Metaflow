<!doctype html>
<html lang="zh-CN">
    <head>
        <title>川流Metaflow</title>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <meta name="description" content="" />
        <meta name="keywords" content="" />
        <meta name="author" content="Metaflow" />
        <link rel="icon" type="image/svg+xml" href="./assets/metaflow_logo.svg" />
        <link rel="apple-touch-icon" href="./assets/metaflow_web-2.jpg" />
        <meta name="metaflow-analytics-sink" content="%METAFLOW_ANALYTICS_SINK%" />
        <meta name="metaflow-analytics-endpoint" content="%METAFLOW_ANALYTICS_ENDPOINT%" />
        <meta name="metaflow-analytics-replay-rate" content="%METAFLOW_ANALYTICS_REPLAY_RATE%" />
        <meta name="metaflow-posthog-key" content="%METAFLOW_POSTHOG_KEY%" />
        <meta name="metaflow-posthog-host" content="%METAFLOW_POSTHOG_HOST%" />
        <meta name="metaflow-posthog-replay" content="%METAFLOW_POSTHOG_REPLAY%" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://metaflow.shuang-su.com/" />
        <meta property="og:title" content="川流Metaflow" />
        <meta property="og:description" content="" />
        <meta property="og:image" content="https://metaflow.shuang-su.com/assets/metaflow_web-2.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="川流Metaflow" />
        <meta name="twitter:description" content="" />
        <meta name="twitter:image" content="https://metaflow.shuang-su.com/assets/metaflow_web-2.jpg" />
        <base href="/" />
        <link rel="stylesheet" href="./index.css" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                overflow: hidden;
            }
        </style>
        <script type="application/json" id="sse-bootstrap">
            null
        </script>
        <script type="module">
            const domainRedirects = {
                'xn--fes68bkzcz5lkjgrkl.com': '/sztu/c2-lib',
                'www.xn--fes68bkzcz5lkjgrkl.com': '/sztu/c2-lib'
            };

            const currentHost = location.hostname.toLowerCase();
            if (domainRedirects[currentHost] && location.pathname === '/') {
                location.replace(domainRedirects[currentHost]);
            }

            const createImage = (url) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.src = url;
                return img;
            };

            const url = new URL(location.href);
            const bootstrap = JSON.parse(document.getElementById('sse-bootstrap').textContent) ?? {};
            const pathname = location.pathname;

            const normalizeRoutePath = (value) => {
                if (!value || value === '/') return '/';
                const trimmed = value.endsWith('/') ? value.slice(0, -1) : value;
                return trimmed || '/';
            };

            const dataUrl = (filePath) => {
                if (!filePath || typeof filePath !== 'string') return null;
                if (/^https?:\/\//i.test(filePath) || filePath.startsWith('/')) return filePath;
                return '/data/' + filePath;
            };

            const parseRecommendedLevel = (recommended) => {
                if (typeof recommended === 'number' && Number.isFinite(recommended)) return recommended;
                if (typeof recommended !== 'string') return null;
                const normalized = recommended.trim().toLowerCase();
                const lodMatch = normalized.match(/^lod\s*(\d+)$/);
                if (lodMatch) return Number(lodMatch[1]);
                if (/^\d+$/.test(normalized)) return Number(normalized);
                return null;
            };

            const pickModelFile = (resource) => {
                const files = resource?.files || {};
                const model = typeof files.model === 'string' ? files.model : null;
                const lod = Array.isArray(files.lod) ? files.lod : [];

                if (!lod.length) return model;

                const recommendedRaw = resource?.fileSize?.recommended ?? resource?.recommended ?? files?.recommended;
                const recommendedLevel = parseRecommendedLevel(recommendedRaw);

                if (recommendedLevel !== null) {
                    const hit = lod.find(
                        (entry) => Number(entry?.level) === recommendedLevel && typeof entry?.file === 'string'
                    );
                    if (hit) return hit.file;
                }

                const firstValidLod = lod.find((entry) => typeof entry?.file === 'string');
                return firstValidLod?.file || model;
            };

            const stripJsonComments = (source) => {
                let result = '';
                let inString = false;
                let stringQuote = '"';
                let escapeNext = false;
                let lineComment = false;
                let blockComment = false;

                for (let i = 0; i < source.length; i++) {
                    const char = source[i];
                    const next = source[i + 1];

                    if (lineComment) {
                        if (char === '\n' || char === '\r') {
                            lineComment = false;
                            result += char;
                        }
                        continue;
                    }

                    if (blockComment) {
                        if (char === '*' && next === '/') {
                            blockComment = false;
                            i++;
                        } else if (char === '\n' || char === '\r') {
                            result += char;
                        }
                        continue;
                    }

                    if (inString) {
                        result += char;
                        if (escapeNext) {
                            escapeNext = false;
                        } else if (char === '\\') {
                            escapeNext = true;
                        } else if (char === stringQuote) {
                            inString = false;
                        }
                        continue;
                    }

                    if (char === '"' || char === "'") {
                        inString = true;
                        stringQuote = char;
                        result += char;
                        continue;
                    }

                    if (char === '/' && next === '/') {
                        lineComment = true;
                        i++;
                        continue;
                    }

                    if (char === '/' && next === '*') {
                        blockComment = true;
                        i++;
                        continue;
                    }

                    result += char;
                }

                return result;
            };

            const stripTrailingCommas = (source) => source.replace(/,\s*([}\]])/g, '$1');
            const parseJsonc = (source) => JSON.parse(stripTrailingCommas(stripJsonComments(source)));

            const retryableResponseStatuses = new Set([408, 425, 429]);
            const isRetryableResponse = (response) =>
                retryableResponseStatuses.has(response.status) || response.status >= 500;
            const waitForRetry = (delayMs) => new Promise((resolve) => window.setTimeout(resolve, delayMs));
            const releaseFailedResponse = async (response) => {
                try {
                    await response.body?.cancel();
                } catch {
                    // The failed response body may already be closed.
                }
            };
            const fetchWithRetry = async (resourceUrl, options) => {
                const maxAttempts = 4;
                for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                    let response;
                    try {
                        response = await fetch(resourceUrl, options);
                    } catch (error) {
                        if (attempt === maxAttempts) {
                            throw error;
                        }
                        console.warn(
                            `[Loader] Transient network failure for ${resourceUrl}; retrying attempt ${attempt + 1}/${maxAttempts}`,
                            error
                        );
                        window.metaflowStartup?.retry({
                            url: resourceUrl,
                            attempt: attempt + 1,
                            maxAttempts,
                            error: String(error?.message || error)
                        });
                        await waitForRetry(500 * 2 ** (attempt - 1));
                        continue;
                    }

                    if (response.ok) {
                        return response;
                    }

                    const retryable = isRetryableResponse(response);
                    if (!retryable || attempt === maxAttempts) {
                        await releaseFailedResponse(response);
                        throw new Error(`Failed to fetch ${resourceUrl}: HTTP ${response.status}`);
                    }

                    console.warn(
                        `[Loader] Transient HTTP ${response.status} for ${resourceUrl}; retrying attempt ${attempt + 1}/${maxAttempts}`
                    );
                    window.metaflowStartup?.retry({
                        url: resourceUrl,
                        attempt: attempt + 1,
                        maxAttempts,
                        error: `HTTP ${response.status}`
                    });
                    await releaseFailedResponse(response);
                    await waitForRetry(500 * 2 ** (attempt - 1));
                }

                throw new Error(`Failed to fetch ${resourceUrl}`);
            };

            const loadSettings = async (settingsUrl) => {
                const response = await fetch(settingsUrl);
                if (!response.ok) return {};
                const text = await response.text();
                if (!text.trim()) return {};
                return parseJsonc(text);
            };

            const prefetch = (resourceUrl) => {
                const pending = fetchWithRetry(resourceUrl);
                void pending.catch(() => {});
                return pending;
            };

            let posterUrl = url.searchParams.get('poster') ?? bootstrap.posterUrl;
            let skyboxUrl = url.searchParams.get('skybox') ?? bootstrap.skyboxUrl;
            let settingsUrl = url.searchParams.get('settings') ?? bootstrap.settingsUrl ?? null;
            let contentUrl = url.searchParams.get('content') ?? bootstrap.contentUrl ?? null;
            let collisionUrl = url.searchParams.get('collision') ?? bootstrap.collisionUrl ?? null;
            let voxelUrl = url.searchParams.get('voxel') ?? bootstrap.voxelUrl;
            let voxelManifestUrl = url.searchParams.get('voxelManifest') ?? bootstrap.voxelManifestUrl;
            let voxelCoordinateSpace = bootstrap.voxelCoordinateSpace ?? null;
            let environmentUrl = url.searchParams.get('environment') ?? bootstrap.environmentUrl;
            let defaultCameraMode = bootstrap.defaultCameraMode ?? null;
            let syntheticAnimation = bootstrap.syntheticAnimation ?? null;
            let animationFirstExitMode = bootstrap.animationFirstExitMode ?? null;
            let experienceType = bootstrap.experienceType ?? null;
            let analyticsResource = bootstrap.analyticsResource ?? null;
            let analyticsRouteMatched = bootstrap.analyticsRouteMatched ?? false;

            const initConfig = async () => {
                if (pathname !== '/' && pathname !== '/index.html' && !contentUrl) {
                    try {
                        // The route index changes independently of large scene
                        // assets. Never reuse an immutable cached copy or newly
                        // published aliases/routes will remain unreachable.
                        const indexResponse = await fetchWithRetry('/data/index.json', {
                            cache: 'no-store'
                        });
                        const indexData = await indexResponse.json();
                        const resources = Array.isArray(indexData?.resources) ? indexData.resources : [];
                        const normalizedPath = normalizeRoutePath(decodeURIComponent(pathname));
                        const resource = resources.find((r) => {
                            const routeMatch = normalizeRoutePath(r?.route) === normalizedPath;
                            const aliasMatch =
                                Array.isArray(r?.aliases) &&
                                r.aliases.some((alias) => normalizeRoutePath(alias) === normalizedPath);
                            return routeMatch || aliasMatch;
                        });

                        if (resource) {
                            analyticsRouteMatched = true;
                            analyticsResource = {
                                id: resource?.id,
                                route: resource?.route,
                                title: resource?.title,
                                category: Array.isArray(resource?.category) ? resource.category : [],
                                experienceType: resource?.experienceType,
                                fileSize: resource?.fileSize,
                                viewer: resource?.viewer,
                                version: resource?.version
                            };
                            contentUrl = dataUrl(pickModelFile(resource));
                            settingsUrl = dataUrl(resource?.files?.settings);
                            posterUrl = posterUrl || dataUrl(resource?.files?.thumbnail);
                            voxelManifestUrl = voxelManifestUrl || dataUrl(resource?.files?.voxelManifest);
                            voxelUrl = voxelUrl || dataUrl(resource?.files?.voxel);
                            collisionUrl = collisionUrl || dataUrl(resource?.files?.collision);
                            environmentUrl = environmentUrl || dataUrl(resource?.files?.environment);
                            defaultCameraMode = resource?.viewer?.defaultCameraMode || null;
                            syntheticAnimation = resource?.viewer?.syntheticAnimation || null;
                            animationFirstExitMode = resource?.viewer?.animationFirstExitMode || null;
                            voxelCoordinateSpace = resource?.viewer?.voxelCoordinateSpace || null;
                            experienceType = resource?.experienceType || null;
                        }
                    } catch (e) {
                        console.warn('Failed to load index.json:', e);
                        // Preserve the route failure instead of requesting the
                        // default scene/settings (which may be SPA HTML here).
                        throw e;
                    }
                }

                if (!contentUrl) {
                    contentUrl = './scene.compressed.ply';
                }
                if (!settingsUrl) {
                    settingsUrl = './settings.json';
                }

                const renderer = url.searchParams.has('webgl') ? 'webgl' : 'webgpu';
                const budgetParam = url.searchParams.get('budget');
                const budget = budgetParam !== null ? Number(budgetParam) : undefined;
                const analyticsReplayRateParam = url.searchParams.get('analyticsReplayRate');
                const analyticsReplayRate =
                    analyticsReplayRateParam !== null
                        ? Number(analyticsReplayRateParam)
                        : bootstrap.analyticsReplayRate;
                const analyticsSink =
                    url.searchParams.get('analyticsSink') ||
                    url.searchParams.get('analytics_sink') ||
                    bootstrap.analyticsSink ||
                    document.querySelector('meta[name="metaflow-analytics-sink"]')?.content ||
                    'supabase';
                const analyticsEndpoint =
                    url.searchParams.get('analyticsEndpoint') ||
                    bootstrap.analyticsEndpoint ||
                    document.querySelector('meta[name="metaflow-analytics-endpoint"]')?.content ||
                    undefined;
                const posthogKey =
                    url.searchParams.get('posthogKey') ||
                    url.searchParams.get('posthog_key') ||
                    bootstrap.posthogKey ||
                    document.querySelector('meta[name="metaflow-posthog-key"]')?.content ||
                    undefined;
                const posthogHost =
                    url.searchParams.get('posthogHost') ||
                    url.searchParams.get('posthog_host') ||
                    bootstrap.posthogHost ||
                    document.querySelector('meta[name="metaflow-posthog-host"]')?.content ||
                    undefined;
                const posthogReplayRaw =
                    url.searchParams.get('posthogReplay') ||
                    url.searchParams.get('posthog_replay') ||
                    document.querySelector('meta[name="metaflow-posthog-replay"]')?.content ||
                    String(bootstrap.posthogReplay ?? '');
                const posthogReplay = ['1', 'true', 'yes', 'on', 'enable', 'enabled'].includes(
                    posthogReplayRaw.trim().toLowerCase()
                );
                const normalizedAnalyticsSink = analyticsSink.trim().toLowerCase();

                return {
                    ...bootstrap,
                    poster: posterUrl && createImage(posterUrl),
                    skyboxUrl,
                    collisionUrl,
                    voxelUrl,
                    voxelManifestUrl,
                    voxelCoordinateSpace: ['world', 'metaflow-rz180'].includes(voxelCoordinateSpace)
                        ? voxelCoordinateSpace
                        : undefined,
                    environmentUrl,
                    environmentContents: environmentUrl ? prefetch(environmentUrl) : null,
                    defaultCameraMode: ['anim', 'orbit', 'fly', 'walk'].includes(defaultCameraMode)
                        ? defaultCameraMode
                        : undefined,
                    syntheticAnimation: syntheticAnimation === 'figure8' ? syntheticAnimation : undefined,
                    animationFirstExitMode: ['orbit', 'default'].includes(animationFirstExitMode)
                        ? animationFirstExitMode
                        : undefined,
                    experienceType: ['character', 'scene'].includes(experienceType) ? experienceType : undefined,
                    analyticsSink: ['supabase', 'posthog', 'dual'].includes(normalizedAnalyticsSink)
                        ? normalizedAnalyticsSink
                        : 'supabase',
                    analyticsEndpoint,
                    analyticsReplayRate: Number.isFinite(analyticsReplayRate) ? analyticsReplayRate : undefined,
                    posthogKey,
                    posthogHost,
                    posthogReplay,
                    analyticsResource,
                    analyticsResourceUrls: {
                        index: dataUrl('index.json'),
                        content: contentUrl,
                        settings: settingsUrl,
                        poster: posterUrl || undefined,
                        environment: environmentUrl || undefined
                    },
                    analyticsRouteMatched,
                    revealEffect: url.searchParams.has('noreveal') ? 'none' : (bootstrap.revealEffect ?? 'radial'),
                    contentUrl,
                    contentFilename: url.searchParams.has('content') ? undefined : bootstrap.contentFilename,
                    reticle: url.searchParams.has('reticle'),
                    contents: prefetch(contentUrl),
                    noui: url.searchParams.has('noui'),
                    noanalytics: url.searchParams.has('noanalytics') || url.searchParams.get('analytics') === '0',
                    noanim: url.searchParams.has('noanim'),
                    nofx: url.searchParams.has('nofx'),
                    hpr: url.searchParams.has('hpr')
                        ? ['', '1', 'true', 'enable'].includes(url.searchParams.get('hpr'))
                        : undefined,
                    ministats: url.searchParams.has('ministats'),
                    colorize: url.searchParams.has('colorize'),
                    unified: url.searchParams.has('unified'),
                    renderer,
                    aa: url.searchParams.has('aa'),
                    budget,
                    heatmap: url.searchParams.has('heatmap'),
                    fullload: url.searchParams.has('fullload'),
                    debug: url.searchParams.has('debug'),
                    lang: url.searchParams.get('lang') || undefined
                };
            };

            window.sseReady = (async () => {
                const sseConfig = await initConfig();
                window.sse = {
                    config: sseConfig,
                    settings: bootstrap.settings ?? loadSettings(settingsUrl)
                };
                // Module loading can finish after settings have already failed.
                // Observe early rejection while keeping it for createViewer.
                void window.sse.settings?.catch?.(() => {});
                return window.sse;
            })();
            // The hosted entry may be retrying its import when routing fails.
            // Keep the original rejected promise for the startup error UI.
            void window.sseReady?.catch(() => {});
        </script>
    </head>
    <body>
        <script type="module">
            import { createViewer } from './index.js';
            try {
                const { config, settings } = await window.sseReady;
                window.metaflowViewer = await createViewer({
                    ...config,
                    settings,
                    container: document.body,
                    exposeGlobals: true
                });
            } catch (error) {
                console.error('[Metaflow] Startup failed:', error);
                const message = document.createElement('p');
                message.textContent = 'Viewer failed to load. Please check the resource and retry.';
                document.body.appendChild(message);
            }
        </script>
    </body>
</html>
